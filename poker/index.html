<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Poker Trainer</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0b2e22;color:#f4f4f8;padding:20px 16px 40px;max-width:520px;margin:auto}button{font:inherit;border:0;border-radius:12px;padding:16px;background:#ffd34d;color:#111;font-weight:800;flex:1}button.r{background:#ff5470;color:#fff}button.c{background:#3aa675;color:#fff}.row{display:flex;gap:8px;margin:14px 0}.cards{font-size:54px;text-align:center;letter-spacing:6px;background:#123f30;border-radius:16px;padding:24px}.muted{color:#bcd}.center{text-align:center}
</style></head><body><a href="../" style="color:#bcd">← Apps</a><h1>🃏 Poker Trainer</h1><p class="muted">Preflop, first to act. What's the standard play? Simplified tight-aggressive chart — a training aid, not GTO.</p>
<div class="cards" id="cards"></div><p class="center" id="pos"></p>
<div class="row"><button class="r" data-a="Fold">Fold</button><button class="c" data-a="Call">Call</button><button data-a="Raise">Raise</button></div>
<p id="msg"></p><p id="score" class="muted"></p><button id="next" style="width:100%;background:#fff;color:#111">Next Hand →</button>
<script>
const ranks='AKQJT98765432',suits=['♠','♥','♦','♣'];let S=JSON.parse(localStorage.getItem('pk')||'{"n":0,"ok":0,"streak":0}'),answer='';
function strength(a,b,suited,pair){if(pair)return a<=4?'premium':a<=8?'strong':'playable';let hi=Math.min(a,b),lo=Math.max(a,b);if(hi<=1)return'premium';if(hi<=3&&lo<=6)return'strong';if(suited&&lo-hi<=2&&lo<=9)return'playable';if(hi<=4&&lo<=8)return'playable';return'weak'}
function deal(){let a=Math.floor(Math.random()*13),b=Math.floor(Math.random()*13),pair=a===b,suited=!pair&&Math.random()<.3;let p=['Early Position','Middle Position','Button'][Math.floor(Math.random()*3)];let s=strength(a,b,suited,pair);answer=(s==='premium'||s==='strong')?'Raise':(s==='playable'?(p==='Button'?'Raise':'Call'):'Fold');cards.textContent=ranks[a]+suits[Math.floor(Math.random()*4)]+' '+ranks[b]+suits[Math.floor(Math.random()*4)];pos.textContent=`${pair?'Pair':suited?'Suited':'Offsuit'} • ${p}`;msg.textContent='';score.textContent=`Score ${S.ok}/${S.n} • Streak ${S.streak}`}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.n++;if(b.dataset.a===answer){S.ok++;S.streak++;msg.textContent='✅ Correct — '+answer+'.'}else{S.streak=0;msg.textContent='❌ Standard play: '+answer+'. Position and hand strength drive preflop.'}localStorage.setItem('pk',JSON.stringify(S));dealSoon()});function dealSoon(){score.textContent=`Score ${S.ok}/${S.n} • Streak ${S.streak}`;setTimeout(deal,900)}next.onclick=deal;deal();
</script></body></html>
