<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Fake Money Sportsbook</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0d1b2a;color:#fff;padding:20px 16px 40px;max-width:520px;margin:auto}button{font:inherit;border:0;border-radius:12px;padding:13px;background:#ffd34d;color:#111;font-weight:800;width:100%;margin:5px 0}button.pick{background:#1d3557;color:#fff;border:1px solid #457}button.sel{background:#2a9d8f}.game{background:#16283d;border-radius:14px;padding:14px;margin:10px 0}input{font:inherit;width:100%;padding:12px;border-radius:10px;border:0;margin:6px 0}.muted{color:#abc}
</style></head><body><a href="../" style="color:#abc">← Apps</a><h1>🏟️ Fake Money Sportsbook</h1><p class="muted">Fictional teams, real odds math. No real money, no real games — results are simulated from the odds.</p>
<p id="bank"></p><div id="games"></div>
<h3>Bet Slip</h3><p id="slip" class="muted">Tap a team to pick them.</p><input id="stake" type="number" inputmode="decimal" value="25" min="1"><button id="place">Place Bet</button><button id="settle" style="background:#fff">Settle All Open Bets ⚡</button><button id="reset" style="background:#334;color:#fff">Reset Bankroll to $1,000</button>
<h3>History</h3><div id="hist"></div>
<script>
let S=JSON.parse(localStorage.getItem('sb')||'{"bank":1000,"bets":[],"hist":[]}');let pickSel=null;
const slate=[["Detroit Motors","Chicago Winds",-145],["Boston Harbor","New York Empire",120],["Denver Peaks","Phoenix Suns-Adjacent",-110],["Seattle Rain","Portland Pines",105],["Austin Armadillos","Nashville Notes",-125],["Miami Vice City","Atlanta Peaches",135]];
function dec(o){return o>0?1+o/100:1+100/Math.abs(o)}
function render(){bank.textContent='Bankroll: $'+S.bank.toFixed(2)+' • Open bets: '+S.bets.length;games.innerHTML=slate.map((g,i)=>`<div class="game"><b>${g[0]} vs ${g[1]}</b><br><button class="pick ${pickSel==i*2?'sel':''}" data-p="${i*2}">${g[0]} (${g[2]>0?'+':''}${g[2]})</button><button class="pick ${pickSel==i*2+1?'sel':''}" data-p="${i*2+1}">${g[1]} (${-g[2]>0?'+':''}${-g[2]||-110})</button></div>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pickSel=+b.dataset.p;render()});let sel=pickSel==null?null:slate[Math.floor(pickSel/2)];slip.textContent=sel?(pickSel%2?sel[1]:sel[0])+' selected':'Tap a team to pick them.';hist.innerHTML=S.hist.slice(-8).reverse().map(h=>`<p class="muted">${h}</p>`).join('')||'<p class="muted">No settled bets yet.</p>';localStorage.setItem('sb',JSON.stringify(S))}
place.onclick=()=>{let amt=+stake.value;if(pickSel==null||!(amt>0)||amt>S.bank){slip.textContent='Pick a team and a valid stake ≤ bankroll.';return}let g=slate[Math.floor(pickSel/2)],team=pickSel%2?g[1]:g[0],odds=pickSel%2?-g[2]:g[2];S.bank-=amt;S.bets.push({team,odds,amt,match:g[0]+' vs '+g[1]});S.hist.push(`OPEN $${amt} on ${team} (${odds>0?'+':''}${odds})`);pickSel=null;render()};
settle.onclick=()=>{if(!S.bets.length)return;S.bets.forEach(b=>{let implied=1/dec(b.odds);let win=Math.random()<implied*.96; /* slight house edge in sim */ if(win){let profit=b.amt*(dec(b.odds)-1);S.bank+=b.amt+profit;S.hist.push(`✅ WON $${profit.toFixed(2)} — ${b.team} (${b.match})`)}else S.hist.push(`❌ LOST $${b.amt} — ${b.team} (${b.match})`)});S.bets=[];render()};
reset.onclick=()=>{S={bank:1000,bets:[],hist:[]};render()};render();
</script></body></html>
