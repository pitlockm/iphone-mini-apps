<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Video Poker Trainer</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#26103f;color:#fff;padding:20px 16px 40px;max-width:520px;margin:auto}.cards{display:flex;gap:6px;justify-content:center;margin:16px 0}.card{width:18%;aspect-ratio:.72;background:#fff;color:#111;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;border:3px solid transparent}.card.red{color:#d21}.card.held{border-color:#ffd34d;transform:translateY(-6px)}.card small{font-weight:600;font-size:10px;color:#765}button{font:inherit;border:0;border-radius:12px;padding:16px;background:#ffd34d;color:#111;font-weight:800;width:100%}.muted{color:#d8cdea}
</style></head><body><a href="../" style="color:#d8cdea">← Apps</a><h1>🎰 Video Poker Trainer</h1><p class="muted">Jacks or Better, 5-credit bet. Tap cards to HOLD, then Draw. Coach shows a strong hold before you draw.</p>
<div class="cards" id="cards"></div><p id="pay"></p><p id="coach" class="muted"></p>
<button id="act">Deal</button><p id="credits"></p>
<script>
let credits=+localStorage.getItem('vp')||1000,deck=[],hand=[],held=new Set(),phase='deal';
const R='A23456789TJQK',S=['♠','♥','♦','♣'];
function shuffle(){deck=[];for(let s=0;s<4;s++)for(let r=0;r<13;r++)deck.push([r,s]);for(let i=deck.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function evaluate(h){let rs=h.map(c=>c[0]).sort((a,b)=>a-b),ss=h.map(c=>c[1]),flush=ss.every(x=>x==ss[0]),counts={};rs.forEach(r=>counts[r]=(counts[r]||0)+1);let groups=Object.values(counts).sort((a,b)=>b-a);let broadway=rs.join()==='0,9,10,11,12';let straight=groups.length==5&&(rs[4]-rs[0]==4||broadway);if(flush&&straight&&broadway)return['ROYAL FLUSH',4000];if(flush&&straight)return['Straight Flush',250];if(groups[0]==4)return['Four of a Kind',125];if(groups[0]==3&&groups[1]==2)return['Full House',45];if(flush)return['Flush',30];if(straight)return['Straight',20];if(groups[0]==3)return['Three of a Kind',15];if(groups[0]==2&&groups[1]==2)return['Two Pair',10];if(groups[0]==2){let pairRank=+Object.keys(counts).find(k=>counts[k]==2);if(pairRank>=10||pairRank==0)return['Jacks or Better',5]}return['No win',0]}
function coachHint(h){let [name]=evaluate(h);if(['ROYAL FLUSH','Straight Flush','Four of a Kind','Full House','Flush','Straight','Three of a Kind','Two Pair'].includes(name))return'Coach: hold the made hand'+(name=='Two Pair'?' (both pairs).':'.');let counts={};h.forEach((c,i)=>{(counts[c[0]]=counts[c[0]]||[]).push(i)});let pair=Object.values(counts).find(g=>g.length==2);if(pair)return'Coach: hold the pair — positions '+(pair.map(i=>i+1).join(' & '))+'.';let high=h.map((c,i)=>[c,i]).filter(([c])=>c>=9||c==0);if(high.length)return'Coach: no pair — usually hold high card(s): '+(high.map(x=>x[1]+1).join(', '))+'.';return'Coach: weak draw — a fresh 5 cards is often fine here.'}
function render(){cards.innerHTML=hand.map((c,i)=>`<div class="card ${c[1]==1||c[1]==2?'red':''} ${held.has(i)?'held':''}" data-i="${i}">${R[c[0]]}<span>${S[c[1]]}</span><small>${held.has(i)?'HOLD':''}</small></div>`).join('');document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{if(phase!='draw')return;let i=+el.dataset.i;held.has(i)?held.delete(i):held.add(i);render()});creditEl()}
function creditEl(){document.getElementById('credits').textContent='Credits: '+credits;localStorage.setItem('vp',credits)}
act.onclick=()=>{if(phase=='deal'){if(credits<5)credits=1000;credits-=5;shuffle();hand=deck.splice(0,5);held.clear();phase='draw';act.textContent='Draw';pay.textContent='';coach.textContent=coachHint(hand);render()}else{hand=hand.map((c,i)=>held.has(i)?c:deck.pop());let [name,payAmt]=evaluate(hand);credits+=payAmt;pay.textContent=name+(payAmt?' — +'+payAmt:'');coach.textContent='Tap Deal for the next hand.';phase='deal';act.textContent='Deal';render()}};
creditEl();
</script></body></html>
